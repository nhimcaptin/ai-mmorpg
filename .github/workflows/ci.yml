name: Foundation
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:54329/mmorpg_test
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:54329/mmorpg_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mmorpg_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mmorpg_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:validate
      - run: pnpm db:migrate
      - run: pnpm db:test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

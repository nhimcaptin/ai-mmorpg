services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mmorpg_dev
      # Chỉ dành cho local: không credentials, không expose ra mạng.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - foundation_postgres:/var/lib/postgresql/data
      - ./apps/server/prisma/init-test.sql:/docker-entrypoint-initdb.d/init-test.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mmorpg_dev']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  foundation_postgres:
